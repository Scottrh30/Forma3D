[package]
name = "forma3d-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Forma3D's modelling engine and viewport renderer"

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.34", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = { version = "30", default-features = false, features = ["std", "wgsl"] }
png = "0.17"
jpeg-decoder = { version = "0.3", default-features = false }
base64 = "0.22"
jpeg-encoder = "0.6"
rayon = { version = "1", optional = true }

[features]
# Renders on every CPU core (the desktop app's backend turns this on).
parallel = ["dep:rayon"]
