# Builds Forma3D for Windows on every push (or with "Run workflow"):
#   Forma3D.exe          the Tauri + Leptos app (needs WebView2, built into Windows 10/11)
#   Forma3D-setup.exe    its installer
# Builds of main are published as the "latest" release. A second job opens
# the web build in Chromium and publishes screenshots as the "preview" release.
name: Windows build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Test the engine and the interface's logic
        run: cargo test --release -p forma3d-core -p forma3d-app
      - name: Build the Tauri app
        run: npx --yes @tauri-apps/cli@2 build
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/forma3d.exe dist/Forma3D.exe
          $setup = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $setup.FullName dist/Forma3D-setup.exe
          Get-ChildItem dist
      # The release below is the real download; a full artifact store must not block it.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Forma3D-windows
          path: dist/
          retention-days: 3
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Forma3D (latest build)
          body: |
            Windows builds of the newest commit on main.
            - Forma3D.exe: the app (Tauri + Leptos). Run it directly; it uses WebView2, which Windows 10 and 11 include.
            - Forma3D-setup.exe: installs it with a Start menu entry.
          prerelease: false
          make_latest: true
          files: |
            dist/Forma3D.exe
            dist/Forma3D-setup.exe

  web-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Build the web interface
        working-directory: app
        run: trunk build --release
      - name: Screenshots
        run: |
          npm init -y > /dev/null
          npm install playwright@1 > /dev/null
          npx playwright install --with-deps chromium > /dev/null
          (cd app/dist && python3 -m http.server 8080 > /dev/null 2>&1 &)
          sleep 2
          node ci/preview.mjs http://localhost:8080/ preview
          node ci/preview.mjs http://localhost:8080/ preview-webgl webgl || true
          for f in preview-webgl/*; do cp "$f" "preview/webgl-$(basename "$f")"; done || true
          ls preview
      - name: Publish preview
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview
          name: Interface preview (screenshots)
          body: Screenshots of the newest web build (${{ github.ref_name }}, ${{ github.sha }}), taken in Chromium on Linux.
          prerelease: true
          make_latest: false
          files: preview/*
