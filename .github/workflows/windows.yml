# Builds Forma3D.exe on GitHub's Windows machines on every push (or with
# "Run workflow"). Each build is the "Forma3D-windows" download on its run's
# page; builds of main are also published as the "latest" release.
name: Windows build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/forma3d.exe dist/Forma3D.exe
          Copy-Item README.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: Forma3D-windows
          path: dist/
      # Every push to main also updates the "latest" release, so the newest
      # build is always at /releases/latest/download/Forma3D.exe.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Forma3D (latest build)
          body: Windows build of the newest commit on main. Download Forma3D.exe and run it.
          prerelease: false
          make_latest: true
          files: dist/Forma3D.exe
