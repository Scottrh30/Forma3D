[workspace]
resolver = "3"
members = ["core", "app", "src-tauri"]
default-members = ["core", "app"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

# Keep debug builds usable: optimise dependencies (wgpu, Leptos) even in dev.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Release builds: optimised and stripped.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
