[package]
name = "forma3d-classic"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Forma3D's original egui interface"

[[bin]]
name = "forma3d-classic"
path = "src/main.rs"

[dependencies]
forma3d-core = { path = "../core" }
bytemuck = { version = "1", features = ["derive"] }
# egui_dock 0.21 is built against egui 0.36, so eframe must stay on 0.36 too.
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui_dock = { version = "0.21", features = ["serde"] }
glam = { version = "0.34", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
