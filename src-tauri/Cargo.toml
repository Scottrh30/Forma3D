[package]
name = "forma3d"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Forma3D: a 3D modelling app (Tauri shell around the Leptos interface)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Remembers the window's size, position, maximized and full-screen state.
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Final renders run here, on every CPU core.
forma3d-core = { path = "../core", features = ["parallel"] }
base64 = "0.22"
